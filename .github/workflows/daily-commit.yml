name: daily-commit

on:
  schedule:
    # Runs every day at 08:17 UTC. GitHub cron is UTC-only and can lag
    # a few minutes under load, which is normal.
    - cron: "17 8 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make a daily change
        run: bash update.sh

      - name: Commit and push
        run: |
          # Author email MUST match a verified email on your GitHub account,
          # or the commit will not count toward your contribution graph.
          git config user.name "rinkuujangraa"
          git config user.email "rinkuujangraa@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "daily activity: $(date -u '+%Y-%m-%d')"
          git push
