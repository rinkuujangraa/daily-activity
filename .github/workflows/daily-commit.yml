name: daily-commit

on:
  schedule:
    # 3 runs a day at natural-looking times (UTC). Adjust to taste.
    # 09:17 UTC  ≈ morning   (e.g. 5am EST / 2am PST)
    - cron: "17 9 * * *"
    # 14:43 UTC  ≈ afternoon (e.g. 10am EST / 7am PST)
    - cron: "43 14 * * *"
    # 20:31 UTC  ≈ evening   (e.g. 4pm EST / 1pm PST)
    - cron: "31 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make a change
        run: bash update.sh

      - name: Commit and push
        run: |
          git config user.name "rinkuujangraa"
          git config user.email "rinkuujangraa@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "activity: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
